configuration:
  port:
    name: Port
    description: Portnummer der Weboberfläche
  tududi_user_email:
    name: Benutzer-E-Mail
    description: E-Mail-Adresse für das Tududi-Benutzerkonto
  tududi_user_password:
    name: Benutzerpasswort
    description: Passwort für das Tududi-Benutzerkonto
  tududi_session_secret:
    name: Sitzungsgeheimnis
    description: Geheimer Schlüssel für die Sitzungsverschlüsselung (generieren Sie eine zufällige Zeichenkette)
  tududi_trust_proxy:
    name: Proxy vertrauen (HA Ingress)
    description: >-
      Den X-Forwarded-*-Headern des Reverse-Proxys vertrauen. Für HA Ingress
      erforderlich - aktiviert lassen. Nur in fortgeschrittenen Setups ohne
      Ingress deaktivieren, in denen dem vorgelagerten Proxy nicht vertraut
      wird; das Deaktivieren führt hinter HA Ingress zu fehlgeschlagenen
      Anmeldungen.
  ff_enable_mcp:
    name: MCP-Server aktivieren
    description: >-
      Stellt die Tududi-MCP-Server-Endpunkte (/api/mcp/*) bereit. Opt-in und
      standardmäßig deaktiviert. Erfordert bei Aktivierung ein Bearer-API-Token,
      das in der Tududi-Oberfläche unter Profil > API Keys erstellt wird.
  disable_telegram:
    name: Telegram deaktivieren
    description: Telegram-Integration deaktivieren
  disable_scheduler:
    name: Scheduler deaktivieren
    description: Den Aufgabenplaner deaktivieren
  upload_path:
    name: Upload-Pfad
    description: Verzeichnispfad für Datei-Uploads
  db_file:
    name: Datenbankdatei
    description: Pfad zur SQLite-Datenbankdatei

network:
  3002/tcp: Weboberfläche (automatisch über Ingress weitergeleitet)
